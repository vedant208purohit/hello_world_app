# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: hello_world_app_development

test:
  <<: *default
  database: hello_world_app_test

production:
  primary: &primary_production
    <<: *default
    database: hello_world_app_production
    username: <%= ENV["POSTGRES_USER"] %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>

  cache:
    <<: *primary_production
    database: hello_world_app_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_production
    database: hello_world_app_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_production
    database: hello_world_app_production_cable
    migrations_paths: db/cable_migrate